[project]
name = "smpcore"
version = "0.1.0"
description = "Shared models for the strategy console control plane"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smpcore*"]
