map $http_upgrade $smp_connection {
    default upgrade;
    ''      $http_connection;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /mcp {
        set $upstream web-api;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 控制台插件和终端走这里。前缀去掉后就是网站后台原来的 /api。
    location /console-api/ {
        set $upstream web-api;
        rewrite ^/console-api/(.*)$ /api/$1 break;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $smp_connection;
    }

    # 单页应用仍使用 /api。dsh 自己的接口在 /dsh/api，由下面的挂载剥掉前缀。
    location /api/ {
        set $upstream web-api;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $smp_connection;
    }

    location = /dsh {
        return 308 /dsh/;
    }

    location /dsh/ {
        client_max_body_size 32m;
        set $upstream dsh;
        rewrite ^/dsh/(.*)$ /$1 break;
        proxy_pass http://$upstream:3080;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $smp_connection;
        proxy_cookie_path / /dsh/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
