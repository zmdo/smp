[project]
name = "smp-web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn>=0.34.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "httpx>=0.28.1",
  "bcrypt>=4.2.1",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "itsdangerous>=2.2.0",
  "pyotp>=2.9.0",
  "cryptography>=43.0.3",
  "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smp_web*"]
