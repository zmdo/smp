[project]
name = "smp-ops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn>=0.34.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "paramiko>=3.5.1",
  "cryptography>=43.0.3",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "ccxt>=4.5.88",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smp_ops*"]
